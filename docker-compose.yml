version: "3.9"

x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  REDIS_URL: ${REDIS_URL:-redis://:redis_secure_password@redis:6379}
  RABBITMQ_URL: ${RABBITMQ_URL:-amqp://medicore:rabbitmq_secure_password@rabbitmq:5672}
  JWT_SECRET: ${JWT_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - medicore-network
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  # ─── Infrastructure ─────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: medicore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medicore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medicore_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-medicore}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - medicore-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medicore}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medicore-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_password} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - medicore-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: medicore-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-medicore}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq_secure_password}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - medicore-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── API Gateway ─────────────────────────────────────────────────────────────

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: medicore-api-gateway
    <<: *service-defaults
    environment:
      <<: *common-env
      PORT: ${API_GATEWAY_PORT:-3000}
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3003
      BILLING_SERVICE_URL: http://billing-service:3004
      PURCHASE_SERVICE_URL: http://purchase-service:3005
      ANALYTICS_SERVICE_URL: http://analytics-service:3006
      AI_SERVICE_URL: http://ai-assistant-service:3007
      NOTIFICATION_SERVICE_URL: http://notification-service:3008
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
    ports:
      - "3000:3000"

  # ─── Auth Service ─────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: medicore-auth-service
    <<: *service-defaults
    environment:
      <<: *common-env
      PORT: ${AUTH_SERVICE_PORT:-3001}
      DB_URL: ${AUTH_DB_URL:-postgresql://medicore:medicore_secure_password@postgres:5432/medicore_auth}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

  # ─── User Service ─────────────────────────────────────────────────────────────

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: medicore-user-service
    <<: *service-defaults
    environment:
      <<: *common-env
      PORT: ${USER_SERVICE_PORT:-3002}
      DB_URL: ${USER_DB_URL:-postgresql://medicore:medicore_secure_password@postgres:5432/medicore_users}

  # ─── Inventory Service ────────────────────────────────────────────────────────

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: medicore-inventory-service
    <<: *service-defaults
    environment:
      <<: *common-env
      PORT: ${INVENTORY_SERVICE_PORT:-3003}
      DB_URL: ${INVENTORY_DB_URL:-postgresql://medicore:medicore_secure_password@postgres:5432/medicore_inventory}

  # ─── Billing Service ──────────────────────────────────────────────────────────

  billing-service:
    build:
      context: ./services/billing-service
      dockerfile: Dockerfile
    container_name: medicore-billing-service
    <<: *service-defaults
    environment:
      <<: *common-env
      PORT: ${BILLING_SERVICE_PORT:-3004}
      DB_URL: ${BILLING_DB_URL:-postgresql://medicore:medicore_secure_password@postgres:5432/medicore_billing}

  # ─── Purchase Service ─────────────────────────────────────────────────────────

  purchase-service:
    build:
      context: ./services/purchase-service
      dockerfile: Dockerfile
    container_name: medicore-purchase-service
    <<: *service-defaults
    environment:
      <<: *common-env
      PORT: ${PURCHASE_SERVICE_PORT:-3005}
      DB_URL: ${PURCHASE_DB_URL:-postgresql://medicore:medicore_secure_password@postgres:5432/medicore_purchase}

  # ─── Analytics Service ────────────────────────────────────────────────────────

  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    container_name: medicore-analytics-service
    <<: *service-defaults
    environment:
      <<: *common-env
      PORT: ${ANALYTICS_SERVICE_PORT:-3006}
      DB_URL: ${ANALYTICS_DB_URL:-postgresql://medicore:medicore_secure_password@postgres:5432/medicore_analytics}

  # ─── AI Assistant Service ─────────────────────────────────────────────────────

  ai-assistant-service:
    build:
      context: ./services/ai-assistant-service
      dockerfile: Dockerfile
    container_name: medicore-ai-assistant-service
    <<: *service-defaults
    environment:
      <<: *common-env
      PORT: ${AI_SERVICE_PORT:-3007}
      DB_URL: ${ANALYTICS_DB_URL:-postgresql://medicore:medicore_secure_password@postgres:5432/medicore_analytics}
      OPENAI_API_KEY: ${OPENAI_API_KEY}

  # ─── Notification Service ─────────────────────────────────────────────────────

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: medicore-notification-service
    <<: *service-defaults
    environment:
      <<: *common-env
      PORT: ${NOTIFICATION_SERVICE_PORT:-3008}
      # Notification service shares the analytics database for notifications table
      DB_URL: ${ANALYTICS_DB_URL:-postgresql://medicore:medicore_secure_password@postgres:5432/medicore_analytics}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMS_API_KEY: ${SMS_API_KEY}
      SMS_API_URL: ${SMS_API_URL}

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────────────────

  nginx:
    image: nginx:1.25-alpine
    container_name: medicore-nginx
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - medicore-network
    depends_on:
      - api-gateway

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:

networks:
  medicore-network:
    driver: bridge
