apiVersion: v1
kind: Namespace
metadata:
  name: medicore
  labels:
    app: medicore-distribution
---
# ─── ConfigMap (non-secret config) ───────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: medicore-config
  namespace: medicore
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  TOTAL_BRANCHES: "18"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX: "100"
  JWT_ACCESS_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  RABBITMQ_HOST: "rabbitmq-service"
  RABBITMQ_PORT: "5672"
---
# ─── API Gateway Deployment ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: medicore
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: medicore/api-gateway:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: medicore-config
            - secretRef:
                name: medicore-secrets
          env:
            - name: PORT
              value: "3000"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:3001"
            - name: USER_SERVICE_URL
              value: "http://user-service:3002"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:3003"
            - name: BILLING_SERVICE_URL
              value: "http://billing-service:3004"
            - name: PURCHASE_SERVICE_URL
              value: "http://purchase-service:3005"
            - name: ANALYTICS_SERVICE_URL
              value: "http://analytics-service:3006"
            - name: AI_SERVICE_URL
              value: "http://ai-assistant-service:3007"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:3008"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: medicore
spec:
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medicore-ingress
  namespace: medicore
  annotations:
    nginx.ingress.kubernetes.io/enable-gzip: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - host: api.medicore.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000
